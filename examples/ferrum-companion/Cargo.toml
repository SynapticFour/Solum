[package]
name = "solum-example-ferrum-companion"
description = "Mode B reference: Crypt4GH interop + AuthClaims smoke; optional ferrum-storage round-trip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Choice: dedicated workspace member under examples/ferrum-companion/ (not
# `cargo run --example` on solum-core). Keeps the binary out of the product
# crate, mirrors the roadmap path examples/ferrum-companion/, and lets
# verify.sh invoke `cargo run -p solum-example-ferrum-companion` cleanly.

[[bin]]
name = "ferrum-companion"
path = "src/main.rs"

[features]
default = []
# Forwards to solum-core's optional Ferrum object-storage reuse (LocalStorage).
storage-backend = [
    "solum-core/ferrum-storage-backend",
    "dep:solum-core",
    "dep:ferrum-storage",
    "dep:tokio",
    "dep:tempfile",
]

[dependencies]
crypt4gh = "0.4.1"
solum-crypto.workspace = true
solum-profiles.workspace = true
solum-core = { workspace = true, optional = true }
# Same pin as crates/crypto ferrum-core / solum-core ferrum-storage-backend.
ferrum-storage = { git = "https://github.com/SynapticFour/Ferrum.git", rev = "2bd147c99735866ac9cfb530f62ef984c8efce8b", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tempfile = { workspace = true, optional = true }
