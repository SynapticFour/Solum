[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/profiles",
    "crates/fhir",
    "crates/openehr",
    "crates/audit",
    "crates/crypto",
    "crates/consent",
    "crates/identity",
    "crates/auth-verify",
    "examples/ferrum-companion",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/SynapticFour/Solum"
rust-version = "1.91.1"
authors = ["Synaptic Four <hello@synapticfour.com>"]
# Internal workspace only — not published to crates.io (enables cargo-deny allow-wildcard-paths).
publish = false

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

# Internal crates
solum-core = { path = "crates/core" }
solum-profiles = { path = "crates/profiles" }
solum-fhir = { path = "crates/fhir" }
solum-openehr = { path = "crates/openehr" }
solum-audit = { path = "crates/audit" }
solum-crypto = { path = "crates/crypto" }
solum-consent = { path = "crates/consent" }
solum-identity = { path = "crates/identity" }
solum-auth-verify = { path = "crates/auth-verify" }

[patch.crates-io]
# SynapticFour crypt4gh fork (same lineage as Ferrum/third_party/crypt4gh):
# removes unmaintained rust-crypto (RUSTSEC-2022-0011). Keep in sync with Ferrum.
crypt4gh = { path = "third_party/crypt4gh" }
