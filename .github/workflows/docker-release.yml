name: GHCR sidecar image

# Image publish only. Not a test workflow. Tag or manual dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Image name
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.sidecar
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          sbom: true
          provenance: false
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/solum-sidecar:${{ github.ref_name }}
