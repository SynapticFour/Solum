name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Pin for reproducible CI; bump deliberately with Ferrum/Lab Kit when convenient.
  GITLEAKS_VERSION: '8.24.3'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # gitleaks-action@v3 builds a `base^..head` range that fails when `base` is
      # the repository root commit (no parent). Full-history detect is reliable
      # for this small workspace and matches the security intent.
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . -v --redact --exit-code=1
