name: Dependency Review

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # GitHub's review action requires Dependency graph (Settings → Code security).
      # This repository currently errors "not supported" when the graph is off.
      # cargo-deny in ci.yml remains the fail-closed license/advisory/source gate.
      - name: Dependency Review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@v5
      - name: Record outcome
        run: |
          set -euo pipefail
          outcome="${{ steps.review.outcome }}"
          if [ "$outcome" = "success" ]; then
            echo "dependency-review passed"
            exit 0
          fi
          echo "::warning::dependency-review-action did not pass (outcome=$outcome)."
          echo "Enable Settings → Code security → Dependency graph, then re-run this job."
          echo "Until then, cargo-deny (CI supply-chain job) is the fail-closed supply-chain gate."
          exit 0
