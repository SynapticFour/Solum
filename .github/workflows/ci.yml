name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Dependabot is disabled org-wide; keep the guard for stray bot PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # crypt4gh → sodiumoxide → libsodium-sys (not preinstalled on ubuntu-latest)
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Profile startup refusal (eu-ehds)
        run: |
          set -euo pipefail
          cargo run -p solum-core --quiet -- check --profile config/profiles/eu-ehds.toml
          if SOLUM_STORAGE_REGION=us-east-1 cargo run -p solum-core --quiet -- check --profile config/profiles/eu-ehds.toml; then
            echo "::error::expected non-zero exit for contradictory storage region"
            exit 1
          fi

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
