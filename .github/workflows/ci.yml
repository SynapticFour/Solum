name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Dependabot is disabled org-wide; keep the guard for stray bot PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # crypt4gh → sodiumoxide → libsodium-sys (not preinstalled on ubuntu-latest)
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prove (offline)
        run: make prove
      - name: Profile startup refusal (eu-ehds)
        env:
          SOLUM_STORAGE_REGION: EU
        run: |
          set -euo pipefail
          cargo run -p solum-core --quiet -- check --profile config/profiles/eu-ehds.toml
          if SOLUM_STORAGE_REGION=us-east-1 cargo run -p solum-core --quiet -- check --profile config/profiles/eu-ehds.toml; then
            echo "::error::expected non-zero exit for contradictory storage region"
            exit 1
          fi
          if env -u SOLUM_STORAGE_REGION cargo run -p solum-core --quiet -- check --profile config/profiles/eu-ehds.toml; then
            echo "::error::expected non-zero exit when SOLUM_STORAGE_REGION is unset on eu-ehds"
            exit 1
          fi

  feature-paths:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-paths
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config
      - name: vendored crypt4gh fork tests
        working-directory: third_party/crypt4gh
        run: |
          set -euo pipefail
          # Alice/Bob fixtures are gitignored (and would trip gitleaks if committed).
          cargo run --quiet -- keygen --sk tests/testfiles/bob.sec --pk tests/testfiles/bob.pub --nocrypt --force
          cargo run --quiet -- keygen --sk tests/testfiles/alice.sec --pk tests/testfiles/alice.pub --nocrypt --force
          cargo test -- --test-threads 1
      # ferrum-storage and aws-kms pull aws-sdk-* which require rustc ≥ 1.94.1
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: ferrum-storage-backend tests
        env:
          RUSTUP_TOOLCHAIN: "1.94.1"
        run: cargo test -p solum-core --features ferrum-storage-backend --lib
      - name: aws-kms mocked tests
        env:
          RUSTUP_TOOLCHAIN: "1.94.1"
        run: |
          cargo test -p solum-crypto --features aws-kms --test aws_kms
          cargo check -p solum-core --features aws-kms
          cargo check -p solum-sidecar --features aws-kms

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
