[package]
name = "solum-sidecar"
description = "HTTP sidecar wrapping Deployment *_as methods for non-Rust HMIS/EHR integrators (CustomerHeld --keys-dir; gated --ephemeral)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "solum-sidecar"
path = "src/main.rs"

[features]
default = []
# Optional AWS KMS --wrapped-keys-dir (H2.4). Default off. Env credentials (no aws-config).
aws-kms = ["solum-crypto/aws-kms", "solum-core/aws-kms"]

[dependencies]
axum = "0.7"
clap = { workspace = true, features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
solum-core.workspace = true
solum-crypto.workspace = true
solum-identity.workspace = true
solum-auth-verify = { workspace = true, features = ["http"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
sha2.workspace = true
serde_json.workspace = true
