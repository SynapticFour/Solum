[package]
name = "solum-core"
description = "Solum product core — clinical compliance orchestration (not a Ferrum fork)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "solum"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
solum-profiles.workspace = true
solum-crypto.workspace = true
solum-audit.workspace = true
solum-fhir.workspace = true
solum-openehr.workspace = true
solum-consent.workspace = true
# AuthClaims → SolumActor mapping; ferrum-core itself is already linked via solum-crypto.
solum-identity = { workspace = true, features = ["ferrum-companion"] }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
