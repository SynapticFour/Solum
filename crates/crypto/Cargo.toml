[package]
name = "solum-crypto"
description = "Solum Crypt4GH field encryption and customer-held key management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Optional AWS KMS wrap/unwrap for Crypt4GH X25519 seeds (GTM-3). Default off so
# Mode A / non-AWS builds never resolve aws-sdk-kms, aws-config, or tokio via this crate.
# aws-smithy-mocks + test-util are included so tests/aws_kms.rs (required-features)
# can drive Encrypt/Decrypt without listing those crates in always-on [dev-dependencies]
# (which would break MSRV 1.91.1 CI via cargo clippy --all-targets).
aws-kms = ["dep:aws-sdk-kms", "dep:aws-config", "dep:tokio", "dep:aws-smithy-mocks"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Crypt4GH envelope (same format as Ferrum). Use the SynapticFour fork via
# workspace [patch.crates-io] — see root Cargo.toml and docs/CRYPTO.md.
crypt4gh = "0.4.1"

# Pin must stay in sync with config/ci/ferrum-revision.txt (full git SHA).
ferrum-core = { git = "https://github.com/SynapticFour/Ferrum.git", rev = "27a6a8e9a719fd1a171da28b20462a777f95cf65" }

# Feature-gated AWS KMS client (symmetric Encrypt/Decrypt of 32-byte seeds).
# test-util: only pulled when aws-kms is enabled (for smithy mocks in tests/aws_kms.rs).
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "test-util"] }
aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-smithy-mocks = { version = "0.2", optional = true }
# Runtime stays with the caller for async wrap/unwrap; listed so the feature
# surface matches ferrum-storage-backend (tokio only when aws-kms is on).
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }

[dev-dependencies]
solum-profiles = { workspace = true }
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Skipped entirely unless `--features aws-kms` (see CI MSRV note above).
[[test]]
name = "aws_kms"
path = "tests/aws_kms.rs"
required-features = ["aws-kms"]
