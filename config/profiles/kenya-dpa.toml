# Solum jurisdiction profile — Kenya Data Protection Act 2019 + Digital Health Act 2023
#
# Primary legal anchors: DPA 2019 (sensitive personal data / health; consent;
# cross-border transfer; strategic-interest localisation) and Digital Health
# Act 2023 (integrated health information system retention, consent to process
# sensitive health data, health-tourism disclosure limits). Supervisory
# authority for the DPA: Office of the Data Protection Commissioner (ODPC).
#
# Same schema_version as eu-ehds.toml — data-only extension.
#
# STATUS: PROVISIONAL-PRODUCTION-CANDIDATE — engineering-aligned after a
# **non-counsel** Vorprüfung (2026-08-06). NOT production SoR. NOT ODPC-
# certified. Real Kenya data-protection / health-tech counsel must still
# confirm before any PRODUCTION flip. See:
#   docs/counsel/KENYA-K1-VORPRUEFUNG.md
#   docs/counsel/KENYA-K1-BRIEF.md
#   docs/profiles.md § Kenya

schema_version = 1

[meta]
profile = "kenya-dpa"
jurisdiction = "KE"
description = "Kenya DPA 2019 + Digital Health Act 2023 compliance posture for clinical electronic health data (sensitive personal data; KE primary residency)"
references = [
    "Data Protection Act, 2019 (Kenya) — Act No. 24 of 2019",
    "Data Protection (General) Regulations, 2021",
    "Digital Health Act, 2023 (Kenya) — Act No. 15 of 2023",
    "ODPC Guidance Note on the Processing of Health Data (2024)",
    "ODPC Guidance Note on Cross-border Data Transfers (2026)",
]

[encryption]
# Clinical field categories (same clinical set as eu-ehds; not jurisdiction-specific).
required_field_categories = [
    "patient_identifier",
    "patient_summary",
    "e_prescription",
    "e_dispensation",
    "medical_images",
    "medical_image_reports",
    "laboratory_results",
    "discharge_reports",
    "clinical_notes",
    "consent_record",
]
allowed_key_custody = ["customer_held"]

[audit]
# DPA security obligations + Digital Health Act s.24 audit-trail expectation.
mandatory_events = [
    "access.granted",
    "access.denied",
    "data.read",
    "data.export",
    "data.receive_eehrxf",
    "consent.granted",
    "consent.revoked",
    "identity.authenticated",
    "key.use",
    "residency.transfer_attempt",
]
helios_export_prepared = true

[retention]
# Solum supports configurable retention. 7300 days is a conservative default
# for deployments aligned with Digital Health Act integrated-system
# expectations — NOT a universal private-sector statutory claim.
# Private clinic/lab pilots: operator/legal confirmation of retention policy
# required (DPA: no indefinite storage). See regulatory.notes.
default_retention_days = 7300          # 20 years (conservative default)
# No ODPC-specific audit retention figure identified; treated as security
# evidence retention (prefer ≥ processing lifetime; often 7–10 years).
# Kept aligned to clinical default as a conservative evidence period.
audit_log_retention_days = 7300

[retention.category_overrides_days]
consent_record = 7300
access_log = 7300
laboratory_results = 7300

[storage]
# Conservative primary residency: Kenya only.
# Rationale: (1) DPA s.50 / General Regulations reg.26 treat provision of
# primary or secondary health care in-country as a strategic-interest
# processing purpose that requires processing on a Kenyan server/data centre
# or at least one serving copy in Kenya; (2) Digital Health Act 2023 s.47
# narrowly frames disclosure of personal health information to persons
# outside Kenya (health tourism). Cross-border transfer under DPA Part VI
# (safeguards / consent / derogations) remains possible for non-primary
# pathways and must be documented outside Solum — not encoded as an allowed
# primary region here. EAC-wide primary storage is NOT listed (no clear
# statutory adequacy / free-circulation basis found for this profile).
allowed_regions = ["KE"]
enforce_residency = true

[consent]
# DPA 2019: consent must be express, free, specific, informed, and purpose-
# limited, with withdrawal (ss.2, 30–32). ODPC Health Data Guidance mirrors
# GDPR-style granular consent. Workflow id `gdpr_granular` is the closest
# existing enum variant — not an EU-law claim.
#
# required_purposes = primary-care floor (not a statutory closed list).
# optional_purposes = secondary / research / insurance — allowed only with
# separate lawful basis and governance; NOT implied by clinical-care consent.
workflow = "gdpr_granular"
required_purposes = [
    "care_provision",
    "emergency_access",
    "care_coordination",
]
optional_purposes = [
    "research",
    "public_health",
    "quality_improvement",
    "health_insurance",
    "billing_or_claims",
]

[transfer]
# Mechanisms name *possible* legal pathways — they are NOT an automatic
# transfer permit. Destinations stay empty → validate_transfer fail-closed
# until Transfer Impact Assessment + operator approval + safeguards fill them.
# Do NOT set permitted_destinations = ["EU"] by default (EU ≠ adequacy).
permitted_mechanisms = [
    "safeguards_based",
    "hdab_mediated",
    "statutory_exception",
]
permitted_destinations = []
requires_serving_copy = true

[regulatory]
annex_requirements = [
    "DPA 2019 s.25 — Principles of data protection (incl. purpose limitation; transfer only with safeguards or consent)",
    "DPA 2019 ss.30–32 — Lawful processing and conditions of consent (purpose-specific; withdrawable)",
    "DPA 2019 ss.44–46 — Sensitive personal data; health data processing by/under healthcare provider or professional secrecy",
    "DPA 2019 ss.48–49 — Cross-border transfer; sensitive data transfer requires consent + appropriate safeguards",
    "DPA 2019 s.50 — Localisation for strategic interests of the State (incl. primary/secondary health care per General Regulations)",
    "Digital Health Act 2023 s.24 — Security, privacy and confidentiality (authN, RBAC, audit trails, encrypted backup)",
    "Digital Health Act 2023 s.25 — Retention minimum twenty years for data held in the integrated health information system",
    "Digital Health Act 2023 ss.31–33 — Consent to process sensitive personal data; withdrawal; safeguards",
    "Digital Health Act 2023 ss.46–47 — Health tourism transfers / disclosure of personal health information outside Kenya",
]
notes = [
    "STATUS: PROVISIONAL-PRODUCTION-CANDIDATE after non-counsel Vorprüfung 2026-08-06 (docs/counsel/KENYA-K1-VORPRUEFUNG.md). Real Kenya counsel review still REQUIRED before PRODUCTION. Not ODPC registration/certification.",
    "Supervisory authority (DPA): Office of the Data Protection Commissioner (ODPC), https://www.odpc.go.ke/",
    "Solum is a compliance layer for clinical data — not a medical device by default.",
    "Features that interpret clinical data for diagnosis/therapy support require an MDCG-style boundary review (see CONTRIBUTING.md).",
    "Genomic / -omic exchange remains Ferrum's domain; Solum does not re-implement GA4GH.",
    "Retention periods are configurable. 7300 days represents a conservative profile default aligned with Digital Health Act integrated-system expectations, not a universal private-sector retention mandate. Private deployments require operator/legal confirmation of retention policy.",
    "No ODPC-specific audit retention period identified; Solum uses a conservative evidence-retention period (7300 days), not a claimed statutory minimum.",
    "Research and secondary-use purposes require separate lawful basis and governance approval; they are not implied by clinical-care consent. Research is optional_purposes only.",
    "Empty permitted_destinations intentionally enforces fail-closed behaviour for cross-border transfers. Listed mechanisms are pathways, not permits. Populate destinations only after TIA + operator approval + contract/safeguards.",
    "Solum provides technical controls for lawful processing. Obligations to register, submit, disclose, or report health information (incl. National Health Data Bank) remain with the data controller/operator. HDB integration / automatic submission / regulatory registration are explicit non-goals.",
    "Edge / offline: policy written in docs/H4-OFFLINE-SYNC-POLICY.md (offline_cache_region must equal deployment_region KE; encrypted local cache only; no master keys on Pi; customer_held keys; on consent.unknown / unreconciled revoke prefer restrict non-emergency processing until sync). Field reconcile wiring = K3.",
]
