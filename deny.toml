[graph]
targets            = []
exclude-unpublished = true
all-features       = false
exclude-dev        = true

[advisories]
yanked       = "warn"
unmaintained = "workspace"
# cargo-deny 0.20: ignore is an array of advisory ids or { id, reason } tables
# (see cargo-deny deny.template.toml). Document accepted risk in LICENSE-COMPATIBILITY.md.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Same rsa advisory via two jsonwebtoken paths: (1) transitive jsonwebtoken <- ferrum-core (RSA-signed JWT verification); (2) direct jsonwebtoken dependency of solum-auth-verify (rust_crypto feature, RS256 path). Not via solum-crypto's own Crypt4GH field encryption. No new risk — one advisory ID, two reference sources. No upstream fix available yet. Tracked upstream in Ferrum; revisit when ferrum-core migrates away from RSA-based JWT or a patched rsa crate ships. See LICENSE-COMPATIBILITY.md / this entry for the accepted-risk record." },
    { id = "RUSTSEC-2026-0104", reason = "CRL-parse panic in rustls-webpki 0.101.7 via rustls 0.21.12 <- aws-smithy-http-client 1.2.0 (AWS SDK KMS/S3/STS used by solum-crypto and ferrum-storage). Workspace already has patched rustls-webpki 0.103.13 on the rustls 0.23 path; rustls 0.21 cannot take 0.103. Not reachable until a CRL is parsed, and only on the AWS TLS stack. Revisit when aws-smithy-http-client / aws-sdk-* drop rustls 0.21. See LICENSE-COMPATIBILITY.md." },
    { id = "RUSTSEC-2026-0098", reason = "Same rustls-webpki 0.101.7 / rustls 0.21.12 AWS SDK path as RUSTSEC-2026-0104: URI name constraints incorrectly accepted. Patched in 0.103.12+; rustls 0.21 cannot take that series. Revisit when aws-sdk-* drop rustls 0.21. See LICENSE-COMPATIBILITY.md." },
    { id = "RUSTSEC-2026-0099", reason = "Same rustls-webpki 0.101.7 / rustls 0.21.12 AWS SDK path as RUSTSEC-2026-0104: wildcard name constraints incorrectly accepted. Patched in 0.103.12+; rustls 0.21 cannot take that series. Revisit when aws-sdk-* drop rustls 0.21. See LICENSE-COMPATIBILITY.md." },
]

[licenses]
version               = 2
confidence-threshold  = 0.8
# BUSL-1.1 compatible; GPL/AGPL/LGPL not in allow list → denied by default
allow = [
    "BUSL-1.1",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Transitive via ferrum-core → reqwest → hyper-rustls → webpki-roots
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[[licenses.clarify]]
name          = "ring"
expression    = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions     = "warn"
wildcards             = "deny"
# Internal workspace `{ path = "crates/..." }` deps omit versions; allow those wildcards.
allow-wildcard-paths  = true
highlight             = "all"
deny                  = []
skip                  = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
# crates.io index URL used by cargo (legacy github.com/crates.io-index unused).
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
# Git-pinned ferrum-core (Lab Kit / CI). Unmatched locally when `.cargo/config.toml`
# path-patches Ferrum; keep for clean clones without the path override.
allow-git        = ["https://github.com/SynapticFour/Ferrum.git"]
