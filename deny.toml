[graph]
targets            = []
exclude-unpublished = true

[advisories]
yanked       = "warn"
unmaintained = "workspace"
# cargo-deny 0.20: ignore is an array of advisory ids or { id, reason } tables
# (see cargo-deny deny.template.toml). Document accepted risk in LICENSE-COMPATIBILITY.md.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Transitive via jsonwebtoken <- ferrum-core (RSA-signed JWT verification), not via solum-crypto's own Crypt4GH field encryption. No upstream fix available yet. Tracked upstream in Ferrum; revisit when ferrum-core migrates away from RSA-based JWT or a patched rsa crate ships. See LICENSE-COMPATIBILITY.md / this entry for the accepted-risk record." },
]

[licenses]
version               = 2
confidence-threshold  = 0.8
# BUSL-1.1 compatible; GPL/AGPL/LGPL not in allow list → denied by default
allow = [
    "BUSL-1.1",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    # Transitive via ferrum-core → reqwest → hyper-rustls → webpki-roots
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[[licenses.clarify]]
name          = "ring"
expression    = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"
deny              = []
skip              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/crates.io-index", "https://github.com/rust-lang/crates.io-index"]
# Git-pinned ferrum-core (Lab Kit pattern) — only Synaptic Four Ferrum.
allow-git        = ["https://github.com/SynapticFour/Ferrum.git"]
